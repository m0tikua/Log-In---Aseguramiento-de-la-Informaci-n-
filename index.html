<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <!-- Corrige la ruta CSS según la ubicación real -->
    <link rel="stylesheet" href="styles.css/stylelogin.css" />
</head>
<body>

    <div class="login-container">
        <div class="avatar">👤</div>
        <h2>Login</h2>
        <!-- Formulario único -->
        <form id="loginForm" action="html/dashboard.html" method="get">
            <div class="input-group">
                <i>👤</i>
                <input type="email" name="email" placeholder="Email ID" required />
            </div>
            <div class="input-group">
                <i>🔒</i>
                <input type="password" name="password" placeholder="Password" required />
            </div>
            <div class="options">
                <label><input type="checkbox" name="remember" /> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit">LOGIN</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Puedes descomentar para evitar el envío y validar manualmente
            // event.preventDefault();

            // Validar campos (opcional)
            const email = this.email.value.trim();
            const password = this.password.value.trim();

            if (!email || !password) {
                alert('Por favor completa todos los campos.');
                event.preventDefault(); // Cancela el envío si falta algo
                return;
            }
    
            // Si está todo bien, el formulario se envía y redirige a dashboard.html
            // No hace falta código adicional si quieres enviar normal.
        });
    </script>


</body>
</html>
