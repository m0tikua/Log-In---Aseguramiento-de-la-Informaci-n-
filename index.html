
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css/stylelogin.css" />
</head>
<body>

    <div class="login-container">
        <div class="avatar">👤</div>
        <h2>Login</h2>

        <!-- Contenedor para mensajes -->
        <div id="message"></div>

        <!-- Formulario -->
        <form id="loginForm">
            <div class="input-group">
                <i>👤</i>
                <input type="email" id="emailInput" name="email" placeholder="Email ID" required />
            </div>
            <div class="input-group">
                <i>🔒</i>
                <input type="password" id="passwordInput" name="password" placeholder="Password" required />
            </div>
            <div class="options">
                <label><input type="checkbox" name="remember" /> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" id="btn" disabled>LOGIN</button>
        </form>
    </div>


    <!-- Lógica corregida -->
     <script src="Js/login.js"></script>
     <script src="Js/save_data.js"></script>

</body>
</html>
